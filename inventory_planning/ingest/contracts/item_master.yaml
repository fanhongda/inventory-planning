doc_type: item_master
description: >
  Item master data from the ERP — one row per SKU, carrying the standing attributes
  and planning parameters the system of record holds: nominated supplier, planned
  lead time, MOQ, order multiple, standard cost, incoterm, item status.

  Its role here is to fill gaps, not to override measurement. A lead time computed
  from actual PO receipts is evidence; a lead time in the item master is an intention
  someone typed in, possibly years ago. Where both exist the measured value wins and
  the two are cross-checked, because a master lead time that no longer resembles what
  suppliers deliver is itself a finding — every MRP run in the ERP is using it.

  Where a SKU has no receipt history at all, the master value is the only lead time
  available and is far better than a config-wide default. That is the case this
  contract exists for.
grain: sku
natural_key: [sku]
capabilities: [lead_time_signal, cost_signal, item_dimension, product_dimension]

# A capability is only real if the field behind it arrived. `product_dimension` is
# here rather than as `required: true` on the field because a required field carries
# 75% of the routing score: demanding one would halve the score of a master that
# lacks it and send the file to a different contract, reporting the wrong problem.
#
# Nothing downstream will complain about a missing family. `assemble._infer_family`
# fills it from the SKU prefix, so a revenue-by-family table built on a numbering
# scheme is indistinguishable from one built on master data. The gap has to be caught
# here or not at all.
capability_requires:
  product_dimension: [product_family]
  item_dimension: [product_family, business_unit, supplier, min_order_qty,
                   order_multiple, item_status]
  cost_signal: [unit_cost]
  lead_time_signal: [lead_time_days]

# `substitution_signal` is deliberately NOT declared here even though `successor_sku`
# below is read. A follow-up material found on this document is *proposed*, never
# applied — see `supersede.py::from_frames` — so a run holding an item master has not
# had its renumberings handled, and a satisfied capability would say it had.

# Item master looks like an inventory snapshot on headers alone — both are one row
# per SKU with descriptive columns. The difference is that a master carries planning
# parameters and no stock position. Requiring a planning parameter to be present, and
# on most rows, keeps a stock report with a stray `MOQ` column from landing here.
discriminator: "not_null(lead_time_days) or not_null(min_order_qty) or not_null(order_multiple)"

# `sku` is the only strictly required field, because masters differ in what they
# carry. That alone would make this contract match every file with an item column and
# outrank the document that genuinely fits — which is exactly how a sales-history
# export ends up filed here, taking the demand signal with it. A master earns the name
# by carrying at least one planning parameter; a file with none of these is a list of
# item numbers, whatever else is on it.
# Only genuine planning parameters count. `incoterm` and `item_status` were here at
# first and had to come out: a PO history carries an incoterm column, which was enough
# to qualify it as a master and left it winning on a thin margin.
identifying_any:
  - [lead_time_days, min_order_qty, order_multiple]

value_domains:

  stocking_policy:
    canonical: [MTS, MTO]
    # No default. An unrecognised code must stay unset rather than become MTO: the
    # policy decides whether stock is expected to sit on the shelf at all, so a
    # guessed value silently rewrites what "past due with stock available" means.
    map:
      "mts": MTS
      "make to stock": MTS
      "make-to-stock": MTS
      "maketostock": MTS
      "stock": MTS
      "stocked": MTS
      "mto": MTO
      "make to order": MTO
      "make-to-order": MTO
      "maketoorder": MTO
      "order": MTO
      "non-stock": MTO
      "non stock": MTO

fields:

  sku:
    type: string
    role: identifier
    required: true
    normalize: material_number
    aliases: [sku, material, material number, part number, part no, product code,
              item code, item no, item number, item id, article, article no,
              stock code, product_id, item_id, matnr, matl, matl no, item]

    # `Item` is banned rather than merely outranked because outranking only works
    # while there is something to outrank. In SAP `Item` is the position within a
    # document — VBAP-POSNR, EKPO-EBELP, MSEG-ZEILE and QMFE-FENUM all render as
    # `Item` — and is never the material. Most other ERPs use it for the material,
    # so the ban is scoped to the dialect that means it as a line number.
    never:
      sap: [item, itm, item no, position, pos, line item, 项目]

  description:
    type: string
    role: dimension
    description: Item description, carried into every report for readability
    aliases: [description, item description, material description, product name,
              item name, name, desc, long description, short text]

  supplier:
    type: string
    role: dimension
    description: >
      Nominated / primary supplier. Where PO history exists the supplier actually used
      wins, since a nomination that nobody buys from does not set the lead time.
    aliases: [supplier, supplier name, supplier id, supplier code, vendor, vendor name,
              vendor code, vendor no, primary supplier, preferred supplier, source,
              manufacturer, default vendor]

  lead_time_days:
    type: decimal
    unit: days
    role: measure
    description: >
      Planned replenishment lead time as maintained in the ERP. Used when no receipt
      history supports a measured value, and cross-checked against the measured value
      when both exist.
    aliases: [lead time, lead time days, lt, lt days, planned delivery time,
              planned deliv. time, plnd delry time, delivery lead time,
              replenishment lead time, purchasing lead time, standard lead time,
              gr processing time]
    assertions:
      - expr: "lead_time_days > 0"
        severity: warn
        description: A zero or negative planned lead time cannot be used for planning

  min_order_qty:
    type: decimal
    unit: base_uom
    role: measure
    description: Supplier minimum order quantity — a hard constraint on any suggested buy
    aliases: [moq, min order qty, minimum order quantity, minimum order qty,
              min qty, minimum lot size, min lot size, minimum quantity, order minimum]

  order_multiple:
    type: decimal
    unit: base_uom
    role: measure
    description: Pack size / rounding value — suggested quantities must be a multiple of it
    aliases: [order multiple, rounding value, lot size increment, pack size,
              pack qty, case qty, multiple, increment, batch size, standard pack]

  unit_cost:
    type: decimal
    unit: currency_per_base_uom
    role: measure
    description: Standard or moving-average cost, for valuing stock and sizing EOQ
    aliases: [unit cost, standard cost, std cost, moving average price, map,
              item cost, cost, unit price, valuation price, purchase price,
              standard price]
    assertions:
      - expr: "unit_cost >= 0"
        severity: error

  currency:
    type: string
    role: dimension
    normalize: upper_strip
    description: >
      Transaction currency of the money columns on this line. A purchase organisation
      spanning several countries raises each order in the supplier's currency, so
      without this field the value columns are a mixture of scales and adding them up
      produces a number that looks like money and is not.
    aliases: [currency, currency code, curr, crcy, doc currency, document currency,
              trans currency, transaction currency, order currency, po currency,
              local currency, waers]

  fx_rate:
    type: decimal
    role: measure
    description: >
      Exchange rate into the reporting currency that the source itself booked for this
      line. When present it outranks the configured rate table, because it is the rate
      the transaction actually settled at rather than a planning average.
    aliases: [exchange rate, exch rate, fx rate, conversion rate, conv rate,
              currency rate, ukurs]

  incoterm:
    type: string
    role: dimension
    description: Decides whether goods in transit sit on the buyer's books
    aliases: [incoterm, inco term, inco terms, delivery term, trade term,
              shipping terms, terms of delivery]

  stocking_policy:
    type: string
    role: dimension
    value_domain: stocking_policy
    description: >
      Whether the item is held on the shelf or bought against a specific order —
      make-to-stock or make-to-order, as the ERP records it. Distinct from the
      pipeline's own `stocking_class`, which is inferred from how often demand
      actually occurred: this is the policy in force, that is the behaviour observed,
      and the gap between them is a finding rather than a contradiction.
    aliases: [stock cat, stock category, stocking policy, stock policy, order policy,
              planning policy, procurement policy, mto/mts, mto mts, fulfilment policy,
              fulfillment policy, replenishment policy]

  business_unit:
    type: string
    role: dimension
    description: >
      The business unit the SKU is sold under — the top level of the segmentation the
      forecast and the sales review are grouped by (BU → product line → country).

      Taken from the master rather than from sales history on purpose: the master is
      curated by someone who knows the portfolio, while the transaction-side copy is
      whatever was stamped on the line at the time and drifts as items are reclassified.
      Where both exist and disagree, that is a finding about master data.

      Optional where `product_family` is not: a site with one business unit still has a
      product line to group by, and blocking a run for the absence of a rollup level
      that does not apply would be a gate about paperwork rather than about numbers.
    aliases: [business unit, bu, pbu, nbu, new business unit, bus unit,
              business segment, business area, product bu, global bu]

  product_family:
    type: string
    role: dimension
    description: >
      Explicit grouping from master data — the product line. The axis revenue,
      days-on-hand and the S&OP review are grouped along, one level below
      `business_unit`.

      Preferred over the family inferred from the SKU prefix, which is only as good as
      the numbering scheme. Where a master carries a two-level hierarchy — `NBU` and
      `NBU 1`, `BU` and `BU 1` — the *finer* level is the family and the coarser one is
      the business unit. Both are read; neither is derived from the other.
    aliases: [product family, family, product group, material group, item group,
              commodity, commodity code, category, product line, segment,
              nbu 1, bu 1, pbu 1, sub bu, sub business unit, product sub line]

  item_status:
    type: string
    role: dimension
    description: >
      Lifecycle flag — active, phase-out, obsolete, blocked. A discontinued item that
      still shows demand history should not be replenished against that history.
    aliases: [status, item status, material status, lifecycle status, life cycle,
              active, obsolete flag, discontinued, mrp status, plant status]

  successor_sku:
    type: string
    role: dimension
    normalize: material_number
    description: >
      The number this one was renumbered to — SAP's follow-up material (MARC-NFMAT),
      and its equivalents elsewhere. Where it is maintained, the renumbering map is an
      export rather than a list somebody retypes, which is the difference between a
      map that exists and one that does not.

      Read, and reported as a proposal — never acted on from here. Merging two item
      numbers restructures every document in the run and leaves no trace in any figure
      downstream, so it takes an act rather than an attribute: this master was handed
      over to supply lead times and MOQs, and this column came along with it. The run
      turns whatever it finds here into a substitution list the planner can check and
      hand back, which is both the confirmation and the saving of the retyping.

      It is also the column most likely to be stale. A follow-up material is maintained
      at the moment of a phase-out decision and consulted years later, if ever.
    aliases: [successor, successor material, successor sku, follow up material,
              followup material, follow-up material, nfmat, replacement material,
              replaced by, superseded by, new material number, 后继物料]
    never:
      sap: [item, itm, item no, position, pos, line item, 项目]

  discontinued_date:
    type: date
    role: dimension
    description: >
      Effective-out date of the renumbering — SAP's MARC-AUSDT. Not needed to merge,
      but it is what lets the run test the claim: an item still shipping months after
      its own discontinuation date has not in fact been superseded.
    aliases: [discontinuation date, discontinued date, effective out date,
              effective-out date, ausdt, obsolete date, valid to, valid until,
              end of life, eol date, 失效日期]

  planner_code:
    type: string
    role: dimension
    description: Who owns this item — used to route recommendations to a person
    aliases: [planner, planner code, mrp controller, buyer, buyer code,
              purchasing group, responsible, owner]

  uom_raw:
    type: string
    role: dimension
    aliases: [uom, unit, unit of measure, base unit, stock unit]

assertions:
  - expr: "not_null(sku)"
    severity: error
