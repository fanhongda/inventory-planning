<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Import review — inventory planning</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>Import review</h1>
  <p class="lede">
    Upload an export and see what it was read as. <strong>Nothing here enters a
    planning run</strong> — not until you say so.
  </p>
</header>

<main>
  <section id="drop" class="drop">
    <input type="file" id="file" hidden>
    <button id="pick" class="primary">Choose a file</button>
    <span class="hint">or drop one here &middot; CSV / Excel</span>
    <p id="status" class="status" hidden></p>
  </section>

  <div id="requirements"></div>
  <div id="results"></div>
</main>

<script type="module" src="/app.js"></script>
</body>
</html>
