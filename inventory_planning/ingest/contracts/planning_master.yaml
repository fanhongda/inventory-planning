doc_type: planning_master
description: >
  The planner's own worksheet — the spreadsheet where the safety stock, min/max,
  review period and lead time actually in use are maintained by hand, usually
  alongside a few columns of demand history.

  This document has a different standing from every other input, and the distinction
  is the whole point of reading it. Everything else here is *evidence*: what shipped,
  what was received, what is on the shelf. This is *decisions*: what a person set the
  parameters to. So it is never treated as a measurement to trust — it is the
  benchmark the computed parameters are compared against, and the gap between the two
  is the finding.

  The one exception is lead time, and only where no receipt history exists. A planner
  who has been buying an item for years knows its lead time; a config-wide default
  does not. Where both are available the measured value wins and the two are
  cross-checked.

  If the worksheet is laid out wide — one row per SKU, one column per month — the
  profiler routes it to `demand_timeseries` for the demand and this contract picks up
  the parameter columns from the same file. Planners keep it that way and the pipeline
  should not make them split it.
grain: sku
natural_key: [sku]
capabilities: [planner_baseline, lead_time_signal]

# Distinguished from the item master by the presence of a parameter no ERP master
# carries as such: a safety stock or a min/max the planner set themselves.
discriminator: >
  not_null(planner_safety_stock) or not_null(planner_reorder_point)
  or not_null(planner_max_qty) or not_null(planner_review_period_days)

# See item_master: `sku` alone would let this contract claim any file with an item
# column. A planner worksheet is defined by carrying a parameter the planner set.
identifying_any:
  - [planner_safety_stock, planner_reorder_point, planner_min_qty, planner_max_qty,
     planner_review_period_days, planner_service_level]

value_domains:

  stocking_policy:
    canonical: [MTS, MTO]
    # No default. An unrecognised code must stay unset rather than become MTO: the
    # policy decides whether stock is expected to sit on the shelf at all, so a
    # guessed value silently rewrites what "past due with stock available" means.
    map:
      "mts": MTS
      "make to stock": MTS
      "make-to-stock": MTS
      "maketostock": MTS
      "stock": MTS
      "stocked": MTS
      "mto": MTO
      "make to order": MTO
      "make-to-order": MTO
      "maketoorder": MTO
      "order": MTO
      "non-stock": MTO
      "non stock": MTO

fields:

  sku:
    type: string
    role: identifier
    required: true
    normalize: material_number
    aliases: [sku, material, material number, part number, part no, product code,
              item code, item no, item number, item id, article, article no,
              stock code, product_id, item_id, matnr, matl, matl no, item]

    # `Item` is banned rather than merely outranked because outranking only works
    # while there is something to outrank. In SAP `Item` is the position within a
    # document — VBAP-POSNR, EKPO-EBELP, MSEG-ZEILE and QMFE-FENUM all render as
    # `Item` — and is never the material. Most other ERPs use it for the material,
    # so the ban is scoped to the dialect that means it as a line number.
    never:
      sap: [item, itm, item no, position, pos, line item, 项目]

  description:
    type: string
    role: dimension
    aliases: [description, item description, material description, product name,
              item name, name, desc]

  planner_safety_stock:
    type: decimal
    unit: base_uom
    role: measure
    description: >
      The safety stock the planner has set. Compared against the quantity the measured
      lead time, its variability and the forecast error actually justify — that
      comparison is the main reason to load this file.
    aliases: [safety stock, ss, safety stock qty, safety qty, buffer stock, buffer,
              ss qty, safety stock level, planned safety stock, min stock,
              minimum stock, safety stock quantity]
    assertions:
      - expr: "planner_safety_stock >= 0"
        severity: warn

  planner_reorder_point:
    type: decimal
    unit: base_uom
    role: measure
    description: Reorder point in use — compared against demand-during-lead-time + SS
    aliases: [reorder point, rop, re-order point, order point, trigger point,
              reorder level, min level, s level]

  planner_min_qty:
    type: decimal
    unit: base_uom
    role: measure
    description: Min of a min-max policy
    aliases: [min, min qty, minimum, min level qty, min stock qty, minmax min,
              min-max min, lower limit]

  planner_max_qty:
    type: decimal
    unit: base_uom
    role: measure
    description: Max of a min-max policy — the ceiling the position is managed to
    aliases: [max, max qty, maximum, max level, max stock, max stock qty,
              minmax max, min-max max, upper limit, target max, s]

  planner_lead_time_days:
    type: decimal
    unit: days
    role: measure
    description: >
      Lead time the planner is working to. Fills in where no receipt history exists;
      otherwise cross-checked against the measured value.
    aliases: [lead time, lead time days, lt, lt days, planning lead time,
              planned lead time, supplier lead time, total lead time, lt (days)]
    assertions:
      - expr: "planner_lead_time_days > 0"
        severity: warn

  planner_review_period_days:
    type: decimal
    unit: days
    role: measure
    description: How often the planner actually reviews this item
    aliases: [review period, review period days, review cycle, review frequency,
              order cycle, ordering cycle, planning cycle, review days,
              reorder cycle days]

  planner_service_level:
    type: decimal
    role: measure
    description: >
      Target service level. Accepted as either a fraction or a percentage — a value
      above 1 is read as a percentage, because both conventions appear in practice.
    aliases: [service level, target service level, service level target, csl,
              fill rate target, sl, service %, service factor]

  planner_min_order_qty:
    type: decimal
    unit: base_uom
    role: measure
    description: MOQ as the planner records it — cross-checked against the item master
    aliases: [moq, min order qty, minimum order quantity, order minimum,
              minimum lot size]

  planner_order_multiple:
    type: decimal
    unit: base_uom
    role: measure
    aliases: [order multiple, pack size, pack qty, case qty, rounding value,
              multiple, increment]

  planner_stocking_class:
    type: string
    role: dimension
    description: >
      The planner's own segmentation — stock / non-stock, A/B/C, make-to-order.
      Preserved rather than recomputed, and compared against the classification the
      demand history supports.
    aliases: [stocking class, stock class, stocking policy, policy, abc, abc class,
              abc code, classification, class, segment, item class, planning class,
              stock type, sopc, sopc class]

  planner_annual_demand:
    type: decimal
    unit: base_uom
    role: measure
    description: >
      Annual usage as the planner records it. Cross-checked against the demand history
      — a large disagreement usually means the two are counting different things
      (shipments vs orders, or a different date basis) and every derived number
      inherits that difference.
    aliases: [annual demand, annual usage, yearly usage, annual qty, aur,
              annual usage rate, 12 month usage, yearly demand, forecast annual]

  planner_monthly_demand:
    type: decimal
    unit: base_uom
    role: measure
    description: Average monthly usage as the planner records it
    aliases: [monthly demand, avg monthly usage, average monthly usage, amu,
              monthly usage, avg monthly demand, mean monthly demand,
              average usage, monthly avg]

  supplier:
    type: string
    role: dimension
    aliases: [supplier, supplier name, vendor, vendor name, source]

  unit_cost:
    type: decimal
    unit: currency_per_base_uom
    role: measure
    aliases: [unit cost, standard cost, std cost, cost, unit price, price]

  currency:
    type: string
    role: dimension
    normalize: upper_strip
    description: >
      Currency the planner's standard cost is stated in. Rarely present on a planning
      master, but when it is, it decides whether that cost can be compared with a
      measured purchase price at all.
    aliases: [currency, currency code, curr, crcy, doc currency, document currency,
              trans currency, transaction currency, local currency, waers]

  stocking_policy:
    type: string
    role: dimension
    value_domain: stocking_policy
    description: >
      Whether the item is held on the shelf or bought against a specific order —
      make-to-stock or make-to-order, as the ERP records it. Distinct from the
      pipeline's own `stocking_class`, which is inferred from how often demand
      actually occurred: this is the policy in force, that is the behaviour observed,
      and the gap between them is a finding rather than a contradiction.
    aliases: [stock cat, stock category, stocking policy, stock policy, order policy,
              planning policy, procurement policy, mto/mts, mto mts, fulfilment policy,
              fulfillment policy, replenishment policy]

  planner_notes:
    type: string
    role: dimension
    description: Free text the planner keeps — never parsed, but shown next to the SKU
    aliases: [notes, note, comment, comments, remark, remarks, reason, rationale]

assertions:
  - expr: "not_null(sku)"
    severity: error
