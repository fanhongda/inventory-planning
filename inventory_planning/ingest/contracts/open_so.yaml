doc_type: open_so
description: >
  Open sales order lines — demand already committed to customers but not yet shipped.
  Beyond feeding the net requirement as backlog, this document is the only source of
  *realised* service performance: a line whose request date has passed while still
  open is a live delivery miss, which is what makes an on-time-delivery KPI
  measurable rather than merely modelled.
grain: sales_order_line

# An open order has not shipped. Used only when the headers cannot separate this from
# sales history — which happens whenever both come from one ERP report run with a
# different filter, and is otherwise unresolvable.
discriminator: "is_null(ship_date)"
natural_key: [so_number, sku]
capabilities: [commitment_signal, service_signal]

fields:

  sku:
    type: string
    role: identifier
    required: true
    normalize: material_number
    aliases: [sku, material, material number, part number, part no, product code,
              item code, item no, item number, item id, article, article no,
              stock code, product_id, item_id, matnr, matl, matl no, item]

    # `Item` is banned rather than merely outranked because outranking only works
    # while there is something to outrank. In SAP `Item` is the position within a
    # document — VBAP-POSNR, EKPO-EBELP, MSEG-ZEILE and QMFE-FENUM all render as
    # `Item` — and is never the material. Most other ERPs use it for the material,
    # so the ban is scoped to the dialect that means it as a line number.
    never:
      sap: [item, itm, item no, position, pos, line item, 项目]

  location_id:
    type: string
    role: dimension
    normalize: upper_strip
    description: >
      Plant / warehouse the line belongs to. Optional, and read from the source
      wherever it exists rather than assumed: only `inventory` used to declare this
      field, so every other document fell through to the configured planning node and
      arrived stamped `DC-01` no matter what plant the export actually named.
    aliases: [location, location id, location code, warehouse, warehouse code,
              warehouse id, plant, storage location, sloc, site, dc, wh, wrh, branch,
              facility, stock location, werks, receiving plant, supplying plant]

  customer:
    type: string
    role: dimension
    description: Enables ranking shortage risk by customer exposure, not just SKU count
    aliases: [customer, customer name, customer code, customer no, sold to, sold-to,
              sold to party, account, client, ship to, buyer]

  so_line_number:
    type: string
    role: identifier
    description: >
      Line within the sales order. Present so `Item` has a home: SAP uses it for the
      line number while other systems use it for the material, and with nowhere else
      to go it was claimed by `sku` — keying the entire backlog on 10, 20, 30 and
      matching no demand at all.
    aliases: [line, line no, line number, so line, sales order line, item, item no.,
              position, pos, line item, seq, sequence]

  so_number:
    type: string
    role: identifier
    aliases: [so number, so no, sales order, sales order number, order number,
              document number, doc no, reference]

  open_qty:
    type: decimal
    unit: base_uom
    role: measure
    required: true
    description: Quantity still owed to the customer
    aliases: [open qty, open quantity, backlog qty, backlog quantity, remaining qty,
              outstanding qty, outstanding quantity, balance quantity, bal. qty,
              undelivered qty, pending qty, unshipped qty, confirmed qty]
    derivable_from:
      - "order_qty - coalesce(shipped_qty, 0)"
      - "order_qty"
    assertions:
      - expr: "open_qty >= 0"
        severity: error

  order_qty:
    type: decimal
    unit: base_uom
    role: measure
    description: Original ordered quantity, retained so open_qty can be derived and fill rate computed
    aliases: [order qty, order quantity, ordered qty, ordered quantity, quantity, qty]

  shipped_qty:
    type: decimal
    unit: base_uom
    role: measure
    aliases: [shipped qty, shipped quantity, delivered qty, delivered quantity,
              qty shipped, qty delivered, picked qty]

  open_amount:
    type: decimal
    unit: currency
    role: measure
    description: Value at risk if this line cannot be served
    aliases: [open amount, open amt, open value, backlog amount, backlog value,
              remaining amount, remaining amt, outstanding amount, outstanding amt,
              outstanding value, net value, net amt, order value, order amt]

  unit_price:
    type: decimal
    unit: currency_per_base_uom
    role: measure
    aliases: [unit price, price, selling price, net price, sales price]
    derivable_from:
      - "open_amount / open_qty"

  currency:
    type: string
    role: dimension
    normalize: upper_strip
    description: >
      Transaction currency of the money columns on this line. A purchase organisation
      spanning several countries raises each order in the supplier's currency, so
      without this field the value columns are a mixture of scales and adding them up
      produces a number that looks like money and is not.
    aliases: [currency, currency code, curr, crcy, doc currency, document currency,
              trans currency, transaction currency, order currency, po currency,
              local currency, waers]

  fx_rate:
    type: decimal
    role: measure
    description: >
      Exchange rate into the reporting currency that the source itself booked for this
      line. When present it outranks the configured rate table, because it is the rate
      the transaction actually settled at rather than a planning average.
    aliases: [exchange rate, exch rate, fx rate, conversion rate, conv rate,
              currency rate, ukurs]

  customer_request_date:
    type: date
    role: timestamp
    required: true
    description: >
      What the customer asked for. The stricter of the two OTD baselines — measuring
      against the promise date instead flatters performance, because the promise was
      already renegotiated once.
    aliases: [customer request date, request date, requested date,
              original requested date, requested delivery date, crd,
              req date, customer req. date, customer req date, required date,
              need by date, wish date, first request date]
    derivable_from:
      - "promise_date"
    assertions:
      - expr: "not_null(customer_request_date)"
        severity: warn
        description: Without a request date this line cannot be aged or counted as past due

  promise_date:
    type: date
    role: timestamp
    description: Date confirmed back to the customer — the commercial commitment
    aliases: [promise date, promised date, confirmed delivery date, confirmed date,
              commit date, committed date, confirmation date, planned ship date,
              scheduled ship date]

  ship_date:
    type: date
    role: timestamp
    description: >
      Actual goods-issue date. On an open order this is empty by definition, and that
      emptiness is what distinguishes this document from sales history when both come
      from the same ERP report under different filters. Aliases are deliberately
      narrow: a "delivery date" on an open order is a promise, not a shipment.
    aliases: [ship date, shipped date, actual ship date, actual shipment date,
              goods issue date, gi date, despatch date, dispatch date]

  order_date:
    type: date
    role: timestamp
    aliases: [order date, so date, sales order date, created date, doc date,
              document date, booking date, entry date]

assertions:
  - expr: "not_null(sku)"
    severity: error
