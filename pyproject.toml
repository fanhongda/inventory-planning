[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inventory-planning"
version = "0.3.0"
description = "Distribution centre inventory planning — demand classification, safety stock, forecasting, purchase recommendations"
# Matched to what CI actually runs. ">=3.9" was a claim nothing tested and that the
# package did not meet: `feedback/loss.py` and `feedback/collector.py` annotate with
# `str | Path`, which is a runtime TypeError before 3.10, and until this branch
# `reporting/kpi_report.py` used a backslash inside an f-string expression — a syntax
# error before 3.12. Both were invisible on a 3.12 developer machine. Widening this
# again means adding the version to the CI matrix first.
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "pyarrow>=14", "duckdb>=1.0", "fastapi>=0.110",
       "httpx>=0.27", "python-multipart>=0.0.9"]
# The fact store writes parquet rather than CSV because it sits exactly where the type
# damage happens — a CSV round trip turns `000000000000123456` back into 123456. Kept
# optional so a planning-only install stays small; without it the store declines to
# write and says so, and the run still produces a plan.
# `duckdb` is the read half. It stores nothing itself — it reads the parquet in
# place — so it is a query engine the store can be swapped out from, not a
# database the store lives in.
store = ["pyarrow>=14", "duckdb>=1.0"]
# The HTTP surface. Optional because the planning pipeline does not depend on it and a
# planner installing this to produce a workbook should not be made to carry a web
# framework. `httpx` is FastAPI's test client, not a runtime dependency of the app.
api = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9", "pyarrow>=14"]

[project.scripts]
inventory-plan = "inventory_planning.cli:main"

# Not code, and not optional. The contracts *are* the schema, the adapters are frozen
# mappings, and the review screen is served from the package — an install that carried
# only the .py files would import cleanly and then fail to route anything.
[tool.setuptools.package-data]
inventory_planning = [
    "ingest/contracts/*.yaml",
    "ingest/adapters/**/*.yaml",
    "api/web/*",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["inventory_planning*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
