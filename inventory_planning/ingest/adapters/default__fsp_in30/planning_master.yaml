name: default__regional_pl30_master__planning_master
doc_type: planning_master
version: 2
tenant: default
system: regional_pl30_master
status: frozen
description: >
  PL30 planning master. Exists for one reason: the export is keyed on a local code in
  `Material` while the ERP number every other extract joins on sits in
  `Alternate material`. Auto-detection maps `sku` to `Material` — that column is a
  perfect alias match — and the result agrees with nothing. Zero of 1,256 sales SKUs
  join; `Alternate material` joins 1,028. Nothing raises, because a merge that finds
  no rows is not an error: the unit costs, the safety stocks and the stocking policy
  simply never arrive, and every figure derived from them reads as absent rather than
  as wrong.

  Frozen rather than drafted because the choice of key cannot be inferred. Both
  columns are plausible identifiers, and only knowing which one the rest of the
  business uses settles it.

fingerprint:
  # Deliberately strict. This adapter redirects the join key, so matching a file it
  # was not written for silently re-keys that file to whatever its second identifier
  # column happens to be. At the default 0.6 threshold `Material` + `Alternate
  # material` + `Std cost` was enough to claim any master-shaped export with a
  # secondary key column — including the synthetic fixture in tests/test_join_keys.py,
  # which then stopped reporting the very mismatch it exists to prove is reported.
  # 0.8 of six requires the PL30-specific columns to be present too.
  min_confidence: 0.8
  header_contains:
    - Material
    - Alternate material
    - Stock Cat
    - Material Classification
    - Std cost
    - vendor name

grain: sku__fine
rollup_to: sku

column_map:
  # The ERP material number, not the local code in `Material`.
  sku: Alternate material
  stocking_policy: Stock Cat
  unit_cost: Std cost
  planner_safety_stock: SS
  supplier: vendor name
  description: Material description

notes:
  - >
    `Alternate material` is stored as a numeric cell, so it reads back as `7100016.0`.
    The `material_number` normalisation on the sku field trims the trailing `.0`
    along with SAP's zero padding; without that step the key still joins nothing.
  - >
    `Stock Cat` carries MTO/MTS as the ERP holds it — 1,583 MTO to 193 MTS across the
    master. It is the policy in force, and is deliberately not merged with the
    pipeline's inferred `stocking_class`: one is the intention, the other is the
    observed behaviour, and where they disagree that is the finding.
  - >
    `Material` (the local code) is left unmapped rather than carried as an alternate
    identifier. Nothing downstream joins on it, and a second identifier column
    invites exactly the mistake this adapter exists to correct.
